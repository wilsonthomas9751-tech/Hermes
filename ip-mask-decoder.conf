# IP Mask Decoder — configuration
# Edit this file to change settings. The systemd service reads it.

# Path to the receiver's private key (PEM format)
PRIV_KEY_PATH=/home/hermes/keys/private.pem

# Host IP to bind the capture socket to (use 0.0.0.0 for all interfaces)
HOST_IP=10.0.0.2

# Network interface to listen on (blank = any)
IFACE=

# Encryption mode: ec or rsa (must match what senders use)
ENC_MODE=ec

# Optional: log decrypted IPs to a file in addition to journal
# LOG_FILE=/var/log/ip-mask-decoder.log
